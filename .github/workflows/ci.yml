name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/check-release.mjs
      - run: node scripts/registry/check.mjs
      - run: npm run build
      # Marketplace runs the committed loader, and it falls back to the
      # committed bundle, so both must match src.
      - name: Ensure dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist is stale. Run 'npm run build' and commit it."
            exit 1
          fi
