name: Registry

# Checks pull requests that change the settings registry, and publishes it to
# the releases bucket once it changes on master. Syncify reads it from there,
# so a merged entry reaches everyone within about a minute.
on:
  # pull_request_target runs this file and its scripts as they are on master,
  # so a pull request can't change the rules it is held to. Nothing from the
  # pull request runs: its registry.json is only read as data. It runs on
  # every pull request, so it can be a required check, and passes at once
  # when registry/ is unchanged.
  pull_request_target:
    # edited, so a change to the Owner line is checked again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]
    paths: [registry/**]

permissions:
  contents: read

jobs:
  owners:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # GitHub's test merge of the pull request into master shows exactly
      # what merging would change, even when master moved on since.
      - name: Read the registry before and after the merge
        id: registry
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! git fetch --no-tags --depth=2 origin "refs/pull/$PR_NUMBER/merge"; then
            echo "::error::GitHub has no test merge for this pull request. Resolve its conflicts with master."
            exit 1
          fi
          if git diff --quiet FETCH_HEAD^1 FETCH_HEAD -- registry/; then
            echo "registry/ is unchanged"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git show FETCH_HEAD^1:registry/registry.json > "$RUNNER_TEMP/base-registry.json" 2> /dev/null || true
          git show FETCH_HEAD:registry/registry.json > "$RUNNER_TEMP/head-registry.json"
      - uses: actions/setup-node@v7
        if: steps.registry.outputs.changed == 'true'
        with:
          node-version-file: .node-version
          # Runs with the base branch's rights, so it skips the shared cache.
          package-manager-cache: false
      - if: steps.registry.outputs.changed == 'true'
        run: npm ci --ignore-scripts
      - name: Check who changed which entries
        if: steps.registry.outputs.changed == 'true'
        env:
          PR_OPENER: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # The login of the app that opens owners' submissions, once it exists.
          SUBMISSION_APP: ${{ vars.REGISTRY_SUBMISSION_APP }}
          MAINTAINER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/registry/owners.mjs "$RUNNER_TEMP/base-registry.json" "$RUNNER_TEMP/head-registry.json"

  upload:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: releases
    # One upload at a time, so the newest master always lands last.
    concurrency:
      group: registry-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # The job holds the R2 keys, so it skips the shared cache.
          package-manager-cache: false
      # Only the upload step sees the R2 keys, and no install script runs.
      - run: npm ci --ignore-scripts
      - name: Check and build registry.json
        run: node scripts/registry/check.mjs --out "$RUNNER_TEMP/registry.json"
      - name: Upload registry.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't accept the checksums AWS CLI 2.23+ sends by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3api put-object \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket syncify-releases \
            --key registry.json \
            --body "$RUNNER_TEMP/registry.json" \
            --content-type application/json \
            --cache-control "public, max-age=60"
